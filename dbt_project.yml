name: 'airbnb_project'
version: '1.0.0'
config-version: 2

profile: 'airbnb_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  airbnb_project:
    staging:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: incremental
      +schema: silver
      +unique_key: id
    marts:
      +materialized: table
      +schema: gold
